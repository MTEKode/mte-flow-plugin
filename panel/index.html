<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTE Flow</title>
<style>
  :root { --r: calc(var(--orca-radius, 8px) - 2px); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; background: var(--orca-background); color: var(--orca-foreground); font: 13px/1.4 var(--orca-font-sans, system-ui, sans-serif); }
  h1 { font-size: 14px; font-weight: 600; margin: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .actions { margin-top: 4px; flex-wrap: wrap; }
  .actions button { white-space: nowrap; flex: 1 1 auto; }
  .section { margin-top: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
  label, .label { font-size: 12px; font-weight: 500; color: var(--orca-muted-foreground); }
  .muted { color: var(--orca-muted-foreground); font-size: 12px; }
  input, textarea, select, .picker { width: 100%; border: 1px solid var(--orca-input); background: transparent; color: inherit; border-radius: var(--r); padding: 0 10px; font: inherit; height: 34px; outline: none; }
  textarea { height: 84px; padding: 8px 10px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { border-color: var(--orca-ring); box-shadow: 0 0 0 2px var(--orca-ring); }
  select, ::picker(select) { appearance: base-select; }
  select { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 0; cursor: pointer; }
  select.fit { flex: 0 0 auto; width: auto; }
  select:disabled { opacity: .5; cursor: default; }
  select::picker-icon { color: var(--orca-muted-foreground); }
  select > button { all: unset; flex: 1; min-width: 0; }
  selectedcontent, option { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
  selectedcontent { overflow: hidden; }
  ::picker(select) { background: var(--orca-popover); color: var(--orca-popover-foreground); border: 1px solid var(--orca-border); border-radius: var(--r); padding: 4px; margin-top: 4px; max-height: 280px; box-shadow: 0 4px 16px color-mix(in srgb, var(--orca-foreground) 20%, transparent); }
  option { padding: 5px 8px; border-radius: 4px; cursor: pointer; }
  option:hover, option:focus-visible { background: var(--orca-accent); color: var(--orca-accent-foreground); outline: none; }
  option::checkmark { order: 1; margin-left: auto; }
  select img, .picker img, .group img, .letter { width: 16px; height: 16px; border-radius: 3px; flex: none; }
  .picker { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 0; text-align: left; }
  .picker:hover:not(:disabled) { background: transparent; color: inherit; }
  .picker .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker .caret { color: var(--orca-muted-foreground); }
  .pop input { position: sticky; top: 0; background: var(--orca-popover); }
  .group { display: flex; align-items: center; gap: 8px; padding: 8px 10px 4px; font-size: 11px; font-weight: 600; color: var(--orca-muted-foreground); }
  .letter { display: inline-grid; place-items: center; font-size: 10px; font-weight: 600; border: 1px solid var(--orca-border); }
  .field > .row > input { flex: 1 1 0; min-width: 0; }
  button { font: inherit; border-radius: var(--r); border: 1px solid var(--orca-border); background: transparent; color: inherit; height: 30px; padding: 0 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--orca-accent); color: var(--orca-accent-foreground); }
  button.primary { background: var(--orca-primary); color: var(--orca-primary-foreground); border-color: var(--orca-primary); }
  button.primary:hover:not(:disabled) { background: var(--orca-primary); color: var(--orca-primary-foreground); opacity: .9; }
  button:disabled { opacity: .5; cursor: default; }
  .pop { position: absolute; z-index: 10; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--orca-popover); color: var(--orca-popover-foreground); border: 1px solid var(--orca-border); border-radius: var(--r); box-shadow: 0 4px 16px color-mix(in srgb, var(--orca-foreground) 20%, transparent); max-height: 260px; overflow: auto; }
  .pop input { border: 0; border-bottom: 1px solid var(--orca-border); border-radius: var(--r) var(--r) 0 0; }
  .opt { padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .opt.active { background: var(--orca-accent); color: var(--orca-accent-foreground); }
  .opt .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; border: 1px solid var(--orca-border); border-radius: 4px; padding: 0 5px; flex: none; color: var(--orca-muted-foreground); }
  .callout { border: 1px solid var(--orca-border); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .callout.danger { border-color: var(--orca-destructive); }
  .callout.danger b { color: var(--orca-destructive); }
  .callout.ok { background: var(--orca-accent); }
  .run { border: 1px solid var(--orca-border); border-radius: var(--r); }
  .run summary { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; list-style: none; }
  .run summary::before { content: '▸'; color: var(--orca-muted-foreground); flex: none; }
  .run[open] summary::before { content: '▾'; }
  .run summary::-webkit-details-marker { display: none; }
  .run .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .run img, .run .letter { width: 16px; height: 16px; border-radius: 3px; flex: none; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .who > div { min-width: 0; }
  .who .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .worker { border-top: 1px solid var(--orca-border); }
  .empty { border: 1px solid var(--orca-border); border-radius: var(--r); padding: 7px 10px; }
  .worker { padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .badge { font-size: 11px; border-radius: 999px; background: var(--orca-primary); color: var(--orca-primary-foreground); padding: 1px 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; border: 1px solid var(--orca-border); border-radius: 999px; padding: 2px 4px 2px 8px; font-size: 12px; }
  .chip > .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button { flex: none; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 999px; line-height: 1; }
  code { font-family: var(--orca-font-mono, ui-monospace, monospace); font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="stack" id="app">
  <div class="row between"><h1>MTE Flow</h1><span class="badge" id="active">0 active</span></div>
  <div id="notices" class="stack" style="gap:8px"></div>

  <div class="field">
    <label for="goal">Goal</label>
    <textarea id="goal" placeholder="Describe the goal…"></textarea>
  </div>

  <div class="field">
    <label for="links">Links</label>
    <input id="links" placeholder="ENG-123, #45, a URL, or search…" role="combobox" aria-expanded="false" aria-controls="links-list" aria-autocomplete="list" autocomplete="off">
    <div class="pop" id="links-list" role="listbox" hidden></div>
    <div class="row" id="chips" style="gap:6px;flex-wrap:wrap" hidden></div>
    <div class="muted" id="links-hint" hidden></div>
  </div>

  <div class="field" id="f-planner">
    <span class="label">Orchestrator</span>
  </div>

  <details id="advanced" class="run">
    <summary>Advanced: workers <span class="muted">(always terminal)</span></summary>
    <div class="stack" style="gap:12px;padding:2px 10px 12px">
      <div class="field" id="f-worker">
        <span class="label">Coder</span>
      </div>
      <div class="field" id="f-qa">
        <span class="label">QA <span class="muted">(validator and QA workers)</span></span>
      </div>
    </div>
  </details>

  <div class="row actions">
    <button type="button" class="primary" id="start">Start run</button>
    <button type="button" id="install">Install MTE in this workspace</button>
    <button type="button" id="repair">Repair setup</button>
    <label class="label" style="display:flex;align-items:center;gap:5px;white-space:nowrap"><input type="checkbox" id="new-ws" style="width:auto;height:auto"> New workspace</label>
  </div>
  <div class="row" id="ws-fields" style="gap:6px" hidden>
    <input id="ws-name" placeholder="Workspace name (empty: from the goal)" aria-label="New workspace name">
    <input id="ws-base" value="origin/main" placeholder="Base branch" aria-label="Base branch">
  </div>
  <div class="muted" id="ws"></div>

  <div class="stack section" style="gap:6px">
    <span class="label">Orchestrators</span>
    <div class="stack" id="runs" style="gap:6px"></div>
  </div>
</div>
<script type="module" src="panel.js"></script>
</body>
</html>
